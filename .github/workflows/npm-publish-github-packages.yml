
name: Deploy Node.js with Self-hosted Runner

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted  # This targets your EC2-based runner

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18  # or 20, based on your project
        cache: 'npm'

    - name: Create .env file from GitHub Secret
      run: |
        touch .env
        printf "%s" "${{ secrets.PROD_ENV }}" > .env

    - name: Install Dependencies
      run: npm ci

    - name: Restart Server with PM2
      run: pm2 restart npm --name "runner-backand-node" -- start || pm2 start npm --name "runner-backand-node" -- start

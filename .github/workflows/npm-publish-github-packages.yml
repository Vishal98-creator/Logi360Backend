name: Deploy Node.js with Self-hosted Runner

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted  # This targets your EC2-based runner

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Create .env file from GitHub Secret
      run: |
        touch .env
        printf "%s" "${{ secrets.PROD_ENV }}" > .env

    - name: Install Dependencies
      run: npm ci

    - name: Build Project
      run: npm run build

    - name: Restart or Start Server with PM2
      run: |
        pm2 startOrReload ecosystem.config.js --env production
